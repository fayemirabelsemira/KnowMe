<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KnowMe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout concept: a calm single column desk. Pill tabs on top, one working panel below.
   The flashcard is the only loud object; the highlighter swipe marks what matters. */
:root {
  --bg: #F1F4F6;
  --surface: #FFFFFF;
  --field: #F6F8F9;
  --ink: #16222B;
  --mute: #566873;
  --line: #D8E0E5;
  --accent: #0E7C86;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFF0;
  --marker: #F6D77A;
  --bad: #B3423A;
  --ok: #2B7A4B;
  --warn: #9A6A00;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171C; --surface: #172229; --field: #0F171C; --ink: #E6EEF2; --mute: #94A6B1;
    --line: #2A3943; --accent: #4FC3CC; --accent-ink: #062226; --accent-soft: #163439;
    --marker: #8A6D12; --bad: #F08A80; --ok: #7CCB9A; --warn: #E9B44C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171C; --surface: #172229; --field: #0F171C; --ink: #E6EEF2; --mute: #94A6B1;
  --line: #2A3943; --accent: #4FC3CC; --accent-ink: #062226; --accent-soft: #163439;
  --marker: #8A6D12; --bad: #F08A80; --ok: #7CCB9A; --warn: #E9B44C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--body);
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 26px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 32px; font-weight: 700; }
.brand h1 span { color: var(--accent); }
.tag { font-family: var(--display); font-weight: 500; font-size: 17px; background: linear-gradient(transparent 52%, var(--marker) 52%, var(--marker) 92%, transparent 92%); padding: 0 4px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.iconbtn:hover { border-color: var(--accent); }

/* tabs */
nav.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; text-decoration: none; color: var(--mute); font-weight: 500; padding: 8px 16px; border-radius: 999px; border: 1px solid transparent; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--ink); background: var(--surface); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.badge { font-family: var(--mono); font-size: 12px; background: var(--marker); color: var(--ink); border-radius: 999px; padding: 0 7px; line-height: 18px; }

/* generic pieces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; min-width: 0; }
.grow { flex: 1 1 200px; min-width: 0; }
.muted { color: var(--mute); }
.small { font-size: 14px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
.mark { background: linear-gradient(transparent 55%, var(--marker) 55%, var(--marker) 92%, transparent 92%); padding: 0 2px; }

.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 5px 12px; font-size: 14px; border-radius: 8px; }

label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--mute); font-weight: 500; min-width: 0; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; color: var(--ink); min-width: 0;
}
textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; }

.track { height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }

.pill { display: inline-flex; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: color-mix(in srgb, var(--marker) 55%, transparent); color: var(--ink); }

/* study */
.hero { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.counts { display: flex; gap: 26px; flex-wrap: wrap; }
.counts b { display: block; font-family: var(--mono); font-weight: 500; font-size: 34px; line-height: 1.1; }
.counts span { font-size: 13px; color: var(--mute); }

.fc { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 1px 0 var(--line), 0 14px 30px -18px rgba(14, 40, 50, 0.35); overflow: hidden; }
.fc-head { display: flex; justify-content: space-between; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--accent-soft); font-size: 13px; color: var(--accent); font-weight: 600; flex-wrap: wrap; }
.fc-body { padding: 36px 26px; text-align: center; min-height: 190px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.fc-q { font-family: var(--display); font-size: clamp(22px, 3.6vw, 32px); font-weight: 500; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.fc-a { border-top: 2px dashed var(--line); padding-top: 22px; font-size: clamp(18px, 2.6vw, 22px); overflow-wrap: anywhere; white-space: pre-wrap; animation: rise 0.25s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fc-a { animation: none; } .track > i { transition: none; } }
.fc-foot { padding: 0 22px 22px; display: flex; flex-direction: column; gap: 14px; }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.rate button { border: 1px solid var(--line); border-top-width: 4px; background: var(--surface); border-radius: 10px; padding: 10px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; }
.rate button small { font-family: var(--mono); font-weight: 400; color: var(--mute); font-size: 12px; }
.rate button:hover { background: var(--field); }
.rate .r0 { border-top-color: var(--bad); }
.rate .r1 { border-top-color: var(--warn); }
.rate .r2 { border-top-color: var(--accent); }
.rate .r3 { border-top-color: var(--ok); }
.verdict { font-size: 15px; padding: 8px 12px; border-radius: 10px; background: var(--field); border: 1px solid var(--line); text-align: left; overflow-wrap: anywhere; }
.verdict.good { border-color: var(--ok); }
.verdict.close { border-color: var(--warn); }
.verdict.miss { border-color: var(--bad); }
.aibox { text-align: left; background: var(--field); border: 1px dashed var(--accent); border-radius: 10px; padding: 12px 14px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* decks */
.decks { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.deck { display: flex; flex-direction: column; gap: 12px; }
.deck h3 { overflow-wrap: anywhere; }
.cardrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.cardrow > div { overflow-wrap: anywhere; }
.cardrow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.stagedrow { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.stagedrow textarea { min-height: 64px; }

/* quiz */
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; cursor: pointer; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* room */
.timer { font-family: var(--mono); font-size: clamp(56px, 13vw, 96px); font-weight: 500; line-height: 1; letter-spacing: -0.02em; }
.peers { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.peer { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--field); min-width: 0; }
.peer b { overflow-wrap: anywhere; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: var(--mute); }
.dot.focus { background: var(--accent); }
.dot.break { background: var(--warn); }

/* progress */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
.tile b { font-family: var(--mono); font-weight: 500; font-size: 32px; line-height: 1.15; }
.tile span { font-size: 13px; color: var(--mute); }
.scroll { overflow-x: auto; }
.scroll svg { min-width: 520px; width: 100%; height: auto; display: block; }
svg .bar { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
svg .bar.today { fill: var(--accent); }
svg .axis { stroke: var(--line); stroke-width: 1; }
svg text { fill: var(--mute); font: 11px var(--mono); }
svg text.val { fill: var(--ink); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: calc(100% - 32px); z-index: 20; }
#toast.on { opacity: 1; }

body:not(.ai) .needs-ai { display: none !important; }
body.ai .no-ai-note { display: none !important; }
body:not(.dl) .needs-dl { display: none !important; }

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .cardrow { grid-template-columns: minmax(0, 1fr); }
  .cardrow .acts { justify-content: flex-start; }
  .stagedrow { grid-template-columns: auto minmax(0, 1fr); }
  .stagedrow > :nth-child(3) { grid-column: 2; }
  .rate { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panel { padding: 16px; }
  .fc-body { padding: 26px 16px; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Know<span>Me</span></h1>
      <span class="tag">Study with Me!</span>
    </div>
    <div class="row" style="gap:8px">
      <span class="pill" id="syncPill" role="status" aria-live="polite"></span>
      <button class="iconbtn" id="themeBtn" type="button">Switch theme</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="app"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ---------- helpers ---------- */
  var KEY = "knowme:v1";
  var DAY = 86400000;
  function $(s, r) { return (r || document).querySelector(s); }
  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
  function dayKey(t) {
    var d = new Date(t === undefined ? Date.now() : t);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function el(tag, props) {
    var e = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") e.className = v;
        else if (k === "text") e.textContent = v;
        else if (k === "on") Object.keys(v).forEach(function (ev) { e.addEventListener(ev, v[ev]); });
        else if (k === "for" || k.indexOf("-") > -1 || k === "role") e.setAttribute(k, v === true ? "" : v);
        else if (k in e) e[k] = v;
        else e.setAttribute(k, v === true ? "" : v);
      });
    }
    var kids = Array.prototype.slice.call(arguments, 2);
    (function add(list) {
      list.forEach(function (k) {
        if (Array.isArray(k)) return add(k);
        if (k === null || k === undefined || k === false) return;
        e.append(k.nodeType ? k : document.createTextNode(String(k)));
      });
    })(kids);
    return e;
  }
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("on"); }, 3200);
  }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function fmtInterval(min) {
    if (min < 60) return Math.max(1, Math.round(min)) + "m";
    var d = min / 1440;
    if (d < 7) return Math.max(1, Math.round(d)) + "d";
    if (d < 30) return Math.round(d / 7) + "w";
    return Math.round(d / 30) + "mo";
  }

  /* ---------- data ---------- */
  function newCard(front, back) { return { id: uid(), front: front, back: back, ease: 2.5, interval: 0, reps: 0, lapses: 0, due: 0 }; }
  function defaults() {
    return { decks: [], log: {}, prefs: { typeFirst: false, newPerDay: 10, nick: "", room: "knowme-lounge", theme: "", examDate: "", examDeck: "all", focusMin: 25, breakMin: 5 } };
  }
  function seeded() {
    var s = defaults();
    var bio = [
      ["Which organelle makes most of a cell's ATP?", "The mitochondrion, through cellular respiration."],
      ["What does the rough endoplasmic reticulum do?", "It makes proteins. Ribosomes sit on its surface."],
      ["What is the job of the Golgi apparatus?", "It modifies, sorts and packages proteins and lipids for transport."],
      ["Which structure controls what enters and leaves a cell?", "The plasma membrane, which is selectively permeable."],
      ["Where does photosynthesis happen in a plant cell?", "In the chloroplasts."],
      ["What do lysosomes contain?", "Digestive enzymes that break down waste and worn-out parts."],
      ["Name one difference between plant and animal cells.", "Plant cells have a cell wall, chloroplasts and a large central vacuole. Animal cells do not."],
      ["What is osmosis?", "Water moving across a selectively permeable membrane toward the side with more dissolved solute."]
    ];
    var study = [
      ["What is the spacing effect?", "Memory lasts longer when reviews are spread out than when they are crammed together."],
      ["Why does retrieval practice beat rereading?", "Pulling an answer out of memory strengthens it. Rereading only makes it feel familiar."],
      ["What is interleaving?", "Mixing topics or problem types in one session instead of studying them in blocks."],
      ["What are the steps of the Feynman technique?", "Pick a concept, explain it simply as if teaching, spot the gaps, go back to the source, then simplify again."],
      ["What is the forgetting curve?", "The steep drop in recall after learning unless the memory is reviewed."],
      ["What happens when you press Again on a card?", "It comes back later in the same session and its interval resets."]
    ];
    s.decks.push({ id: uid(), name: "Biology: Cells", sample: true, cards: bio.map(function (c) { return newCard(c[0], c[1]); }) });
    s.decks.push({ id: uid(), name: "How to study", sample: true, cards: study.map(function (c) { return newCard(c[0], c[1]); }) });
    return s;
  }
  function load() {
    try {
      var r = localStorage.getItem(KEY);
      if (r) {
        var o = JSON.parse(r);
        if (o && Array.isArray(o.decks)) {
          var d = defaults();
          return { decks: o.decks, log: o.log || {}, prefs: Object.assign(d.prefs, o.prefs || {}) };
        }
      }
    } catch (e) {}
    return seeded();
  }
  var S = load();
  function localSave() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function save() { localSave(); scheduleSync(); }

  /* ---------- cloud database (per-user, plus a shared class library) ---------- */
  var db = null, userNS = null, meId = null, cloud = "local";
  var synced = { decks: {}, profile: "" }, syncTimer = null, chain = Promise.resolve(), retried = false;
  var libDocs = [], libUnsub = null;

  function setCloud(state) {
    cloud = state;
    var p = document.getElementById("syncPill"); if (!p) return;
    var map = {
      local: "Saved on this device", loading: "Connecting...", ok: "Saved to your account", saving: "Saving...",
      readonly: "This device only", error: "Cloud sync paused"
    };
    p.textContent = map[state] || "";
    p.className = "pill" + (state === "ok" ? "" : state === "readonly" || state === "error" ? " warn" : "");
    p.title = state === "readonly" ? "Your access level cannot save to the cloud. Ask the owner for Contributor access." : "";
  }
  function bodyOf(d) { return { name: d.name, sample: !!d.sample, created: d.created, cards: d.cards }; }
  function profileJson() { return JSON.stringify({ log: S.log, prefs: S.prefs }); }
  function scheduleSync() {
    if (!db || !meId || (cloud !== "ok" && cloud !== "saving")) return;
    clearTimeout(syncTimer); setCloud("saving");
    syncTimer = setTimeout(function () { syncTimer = null; flushNow(); }, 1500);
  }
  function flushNow() { chain = chain.then(doFlush).catch(function () {}); return chain; }
  function dbFail(e) {
    var c = e && e.code;
    if (c === "invalid_argument") { setCloud("readonly"); toast("Your access level cannot save to the cloud, so decks stay on this device."); return; }
    if (c === "quota_exceeded") { setCloud("error"); toast("The cloud storage for this page is full. Delete some decks."); return; }
    if (c === "unavailable" && !retried) { retried = true; setCloud("saving"); syncTimer = setTimeout(function () { syncTimer = null; flushNow(); }, 3000); return; }
    setCloud("error");
  }
  function doFlush() {
    if (!db || !meId || cloud === "readonly") return Promise.resolve();
    var prof = db.doc("data/users/" + meId + "/profile"), decks = prof.collection("decks");
    var p = Promise.resolve();
    S.decks.forEach(function (d, i) {
      p = p.then(function () {
        if (!d.created) d.created = Date.now() + i;
        var body = bodyOf(d), h = JSON.stringify(body);
        if (synced.decks[d.id] === h) return;
        return decks.doc(d.id).set(body).then(function () { synced.decks[d.id] = h; });
      });
    });
    Object.keys(synced.decks).forEach(function (id) {
      p = p.then(function () {
        if (findDeck(id)) return;
        return decks.doc(id).delete().then(function () { delete synced.decks[id]; });
      });
    });
    p = p.then(function () {
      var ph = profileJson();
      if (synced.profile === ph) return;
      return prof.set({ v: 1, log: S.log, prefs: S.prefs }).then(function () { synced.profile = ph; });
    });
    return p.then(function () { retried = false; if (!syncTimer) setCloud("ok"); localSave(); }).catch(dbFail);
  }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function pull() {
    var prof = db.doc("data/users/" + meId + "/profile");
    return Promise.all([prof.get(), prof.collection("decks").get()]).then(function (r) {
      var psnap = r[0], dsnap = r[1];
      var remote = dsnap.docs.map(function (s) {
        var x = clone(s.data() || {});
        return { id: s.id, name: String(x.name || "Untitled"), sample: !!x.sample, created: x.created || 0, cards: Array.isArray(x.cards) ? x.cards : [] };

  function viewRoom() {
